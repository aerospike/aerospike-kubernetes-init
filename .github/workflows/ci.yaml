# CI for pull requests and master.
# Builds the init images, pushes them to JFrog and scans them.

name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions: {}

# Runs of the same PR wait for each other and run one by one, oldest first.
# None are cancelled. Other runs get their own group, so they never wait.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  queue: max

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare
    # Fork PRs get no secrets or OIDC token, so nothing below can run for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      base-version: ${{ steps.version.outputs.base-version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # Fetches all tags, so Compute version can find the last release.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # e.g. 2.5.6-pr-163-a1b2c3d, 2.5.6-master-e4f5a6b. For a PR the SHA is the PR's head commit.
      # The base is NEXT_VERSION, which must be newer than the last release tag,
      # or the dev versions would sort below that release. The operator webhook
      # also needs a version at the start of the init image tag.
      - name: Compute version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # NEXT_VERSION from the Makefile, e.g. 2.5.6
          base=$(sed -n 's/^NEXT_VERSION ?= *//p' Makefile)

          # Highest release tag in the repo, e.g. 2.5.5, even if HEAD can't reach it.
          # Tags with a dash (2.5.4-rc1) are skipped.
          last=$(git tag -l '[0-9]*.[0-9]*.[0-9]*' | grep -v -- - | sort -V | tail -1)

          # Fail unless base sorts strictly after last. Equal versions also fail.
          newest=$(printf '%s\n' "$last" "$base" | sort -V | tail -1)
          if [ "$newest" = "$last" ]; then
            echo "::error::NEXT_VERSION ($base) must be newer than the last release ($last). Bump it in the Makefile."
            exit 1
          fi

          # pr-163 for a pull request, master for a push to master
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            label="pr-$PR_NUMBER"
          else
            label="master"
          fi

          short_sha=${SHA::7}

          echo "base-version=$base" >> "$GITHUB_OUTPUT"
          echo "version=$base-$label-$short_sha" | tee -a "$GITHUB_OUTPUT"

  init-image:
    name: Init image
    needs: prepare
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@071324c3300969857d2aaca91f06f84bc0533d06 # main
    with:
      jf-project: platforms
      image-name: aerospike-kubernetes-init
      app-version: ${{ needs.prepare.outputs.version }}
      jf-build-name: ako-init
      build-args-json: '{"VERSION": "${{ needs.prepare.outputs.base-version }}"}'
      # Same as the Makefile build targets
      no-cache: true

  # Runs as the non-root user 1001, like docker-buildx-build-push-openshift.
  openshift-image:
    name: OpenShift init image
    needs: prepare
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: aerospike/shared-workflows/.github/workflows/reusable_docker-build-deploy.yaml@071324c3300969857d2aaca91f06f84bc0533d06 # main
    with:
      jf-project: platforms
      image-name: aerospike-kubernetes-init-openshift
      app-version: ${{ needs.prepare.outputs.version }}
      jf-build-name: ako-init-openshift
      build-args-json: '{"VERSION": "${{ needs.prepare.outputs.base-version }}", "USER": "1001"}'
      no-cache: true

  scan:
    name: Vulnerability scan
    needs: init-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      INIT_IMG: ${{ needs.init-image.outputs.immutable-tag }}
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JFrog CLI
        id: jf
        uses: step-security/setup-jfrog-cli@53aeacb709fce45d0baf69a13ec3342f7e2d71a9 # v5.1.0
        env:
          JF_URL: https://artifact.aerospike.io
        with:
          oidc-provider-name: gh-aerospike
          oidc-audience: aerospike

      - name: Login to JFrog
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: artifact.aerospike.io
          username: ${{ steps.jf.outputs.oidc-user }}
          password: ${{ steps.jf.outputs.oidc-token }}

      - name: Set up Snyk
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04

      # Same thresholds as docker-build.yaml
      - name: Scan init image
        run: |
          docker pull "$INIT_IMG"
          snyk container test "$INIT_IMG" --file=Dockerfile --severity-threshold=high --fail-on=all
