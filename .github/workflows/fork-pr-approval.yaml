# Runs CI for a fork PR commit after a maintainer reviews it. Fork PRs get no
# secrets, so ci.yaml can't run for them on its own.
#
# To run it: Actions > Fork PR approval > Run workflow, leave the branch on
# master, and enter the PR number and the full SHA of the commit you reviewed.
#
# Only users with write access can run this. It pushes the commit to
# fork-pr/<PR number> and dispatches ci.yaml there, without running any of the
# PR's code. GitHub refuses the push if the PR changes .github/workflows/.

name: Fork PR approval

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Fork PR number
        required: true
      sha:
        description: Full SHA of the PR commit you reviewed
        required: true

permissions: {}

jobs:
  mirror:
    name: Run CI for a fork PR commit
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Push the commit and start CI
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth=1 origin "refs/pull/${PR}/head"

          # The fork may have pushed since the review.
          if [ "$(git rev-parse FETCH_HEAD)" != "$SHA" ]; then
            echo "::error::The head of PR #$PR is not $SHA. Review the new commit first."
            exit 1
          fi

          git push -q --force origin "${SHA}:refs/heads/fork-pr/${PR}"
          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "fork-pr/${PR}" -f pr-number="$PR"
